[project]
name = "recrbro"
version = "0.1.0"
description = "AI-assisted job discovery with verified LinkedIn offers"
readme = "README.md"
authors = [
    { name = "Grzegorz Kadaj", email = "grzegorz.kadaj@rbo.pl" }
]
requires-python = ">=3.10"
dependencies = [
    "ag-ui-langgraph==0.0.45",
    "black>=26.5.1",
    "copilotkit==0.1.96",
    "fastapi>=0.115,<1",
    "isort>=9.0.1",
    "langchain>=1.4.2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "pydantic>=2.10,<3",
    "pypdf>=5,<7",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20,<1",
    "tavily-python>=0.7,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
recrbro = "recrbro:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.isort]
profile = "black"
